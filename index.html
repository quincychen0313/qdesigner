  dispatchEvent(new CustomEvent('TrunkApplicationStarted', {detail: {wasm}}));
} catch (error) {
  console.error('qDesinger startup:', error);
  if (loading.isConnected) {
    progress('qDesinger 載入失敗');
    const detail = document.createElement('p');
    detail.id = 'startup_error';

    loading.append(detail);
    document.getElementById('photocraft_stalled').style.visibility = 'visible';

</script>
